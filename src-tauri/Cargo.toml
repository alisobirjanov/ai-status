[package]
name = "pulse"
version = "0.1.10"
description = "Claude Code and Codex usage on the Windows desktop"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[lib]
name = "pulse_lib"
crate-type = ["rlib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[features]
# A release build that runs beside the installed Pulse without touching it.
# Turned on by `tauri.dev.conf.json`; see docs/development.md.
dev-copy = []

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
dirs = "7.0.0"
# SChannel rather than rustls: it trusts the Windows certificate store, which is
# what a corporate proxy's certificate is installed into, and needs no C
# toolchain beyond MSVC.
reqwest = { version = "0.13.3", default-features = false, features = ["json", "native-tls", "system-proxy", "http2", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sys-locale = "0.3.2"
tauri = { version = "2.11.6", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-notification = "2.4.0"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-updater = "2.12.0"
tokio = { version = "1.53.1", features = ["rt", "macros", "time", "sync", "process", "io-util"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Console", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
